[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hookrec"
version = "0.1.0"
description = "HookSeq: SASRec-style music recommender on the Yambda dataset"
requires-python = ">=3.10"
dependencies = [
    "polars>=2.1",  # pl.Float16, collect(engine="streaming")
    "pyarrow",
    "numpy",
    "scipy",
    "scikit-learn",
    "pyyaml",
    "matplotlib",
    "huggingface_hub>=0.23",
    "implicit",
]

[project.optional-dependencies]
torch = ["torch"]
demo = ["gradio"]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/hookrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# generated by scripts/make_notebooks.py (whose source is linted); cells run on Kaggle only
extend-exclude = ["notebooks"]
