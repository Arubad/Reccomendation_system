extends: sasrec.yaml
data:  # the ablations a0..a6 inherit both
  input_filter: all  # every event type is input
  window_sampling: random  # random window start per user and epoch
model:
  name: hookseq
  use_audio: true
  use_artist: true
  use_event: true
  use_organic: true
  use_ratio: true
  id_dropout: 0.2
loss:
  logq: true
  dislike_hard_negatives: true
