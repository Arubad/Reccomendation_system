# The paper-comparable `sasrec` row: Listen+ input only, as in the official SASRec benchmark.
data:
  input_filter: listen_plus  # all | listen_plus (sequence set the model reads)
  window_sampling: last  # random | last: one last max_len+1 window per user (official SASRec)
model: {name: sasrec, d_model: 64, n_layers: 2, n_heads: 2, max_len: 200, dropout: 0.2}
train:
  batch_size: 256
  lr: 1.0e-3
  weight_decay: 0.01
  warmup_steps: 1000
  lr_schedule: warmup_cosine  # warmup_cosine | constant (no warmup)
  max_steps: 200000
  schedule_steps: null  # LR cosine horizon; null = max_steps (test refits use the val run's)
  # F3: an eval costs ~1.6 s on a T4, so a fine cadence is cheap and stops ~2K steps after
  # the val peak (it was 10K with 2000 x 5)
  eval_every_steps: 500
  patience: 6  # 3K steps without improvement
  min_delta: 0.0  # an eval must beat the best ndcg@10 by more than this (0 = any gain)
  ckpt_every_steps: 1000
  max_skipped_steps: 50  # consecutive GradScaler-skipped (inf/NaN) steps before failing
  max_grad_norm: 1.0  # null = no clipping
  amp: true  # fp16 autocast + GradScaler on CUDA; false = fp32 on the GPU (NaN fallback)
  # Kaggle sessions die at 9 h. The 1 h margin covers the final checkpoint, the last eval in
  # flight and output saving. max_hours is measured from HOOKREC_SESSION_START (exported by
  # the notebook's first cell) if set, else from process start (data loading included).
  max_hours: 8.0
  num_workers: 4
  seed: 42
  log_every_steps: 100
  eval_max_users: null  # subsample of val users for the periodic eval; the final eval uses all
  eval_batch_size: 1024
loss:
  type: softmax  # softmax (sampled, shared negatives) | bce (official SASRec; sasrec_bce.yaml)
  chunk_rows: 8192  # rows of the [M, S] logits per chunk: memory only, not in training_hash
  max_rows: null  # speed knob, off: keep this many valid rows per batch (uniform, seeded)
  n_uniform_negatives: 8192
  n_in_batch_negatives: 4096
  logq: false
  mix_uniform: 0.0
  temperature: 1.0
  dislike_hard_negatives: false
  n_hard: 4
  like_weight: 0.0  # multi-task like-head BCE weight; only used when model.like_head
