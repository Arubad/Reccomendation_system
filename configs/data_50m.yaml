size: 50m
full_threshold: 50            # EDA: played_ratio_pct at/above which a listen counts as LISTEN_FULL
min_count: 5                  # EDA: min positive train events for an ID embedding
max_len_store: 512            # EDA: stored history per user (revisit against seq_length quantiles)
collapse_consecutive_dups: false  # EDA: collapse runs of identical (item, token) if repeats are heavy
pca_dim: 128
n_shards: 1
split:
  train_days: 300
  gap_seconds: 1800
  test_days: 1
  test_timestamp: 25913600    # official YAMBDA_TEST_TIMESTAMP = 26_000_000 - 86_400; null = max-anchored
embeddings_file: embeddings_{size}.parquet  # K0's filtered file; embeddings.parquet = full HF file
emb_column: embed                           # `normalized_embed` for the full HF file
eval:
  # ground truth: listen_plus (LISTEN_FULL = the paper's Listen+) | positive (FULL or LIKE)
  target: listen_plus
include_embedding_only_items: false   # embedding-only items never appear in events
