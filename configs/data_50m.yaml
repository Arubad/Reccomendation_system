size: 50m
full_threshold: 50            # EDA §2: played_ratio_pct at/above which a listen is LISTEN_FULL (Listen+)
min_count: 5                  # EDA §1: min positive train events for an ID embedding
max_len_store: null           # EDA §7: full history (q99 = 23.8k events/user at 50M; null = no cap)
collapse_consecutive_dups: false  # EDA §4: consecutive duplicates are only 2.0% of events
session_gap_seconds: 1800     # EDA §3: session edge of the gap buckets (must lie in (600, 21600))
pca_dim: 128
n_shards: 1
split:
  train_days: 300
  gap_seconds: 1800
  test_days: 1
  test_timestamp: 25913600    # official YAMBDA_TEST_TIMESTAMP = 26_000_000 - 86_400; null = max-anchored
embeddings_file: embeddings_{size}.parquet  # K0's filtered file; embeddings.parquet = full HF file
emb_column: embed                           # `normalized_embed` for the full HF file
eval:
  # ground truth: listen_plus (LISTEN_FULL = the paper's Listen+) | positive (FULL or LIKE)
  target: listen_plus
include_embedding_only_items: false   # embedding-only items never appear in events
